<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found · Cleo POS</title>
<script>
/* Clean addresses (/app, /login, /signup, /plans, /privacy, /terms) are served by the website's .htaccess.
   A host without it (the interim GitHub Pages site) answers them with this page, which forwards each one
   to its file, keeping the query (sign-in callbacks) and the #route. Anything else shows the note below. */
(() => {
  const seg = location.pathname.replace(/\/+$/, '').split('/').pop();
  const to = { app: ['index.html', ''], login: ['index.html', '#/'], signup: ['index.html', '#/setup'], plans: ['index.html', '#/plans'],
    privacy: ['legal/privacy.html', ''], terms: ['legal/terms.html', ''] }[seg];
  // home: the site's root, or the project folder on GitHub Pages (/Cleo-v1.4/)
  const home = location.hostname.endsWith('.github.io') ? `/${location.pathname.split('/')[1] || ''}/`.replace('//', '/') : '/';
  if (!to) { document.addEventListener('DOMContentLoaded', () => { const a = document.querySelector('[data-home]'); if (a) a.href = home; }); return; }
  const base = location.pathname.replace(/\/+$/, '').replace(/[^/]*$/, '');
  location.replace(base + to[0] + location.search + (location.hash || to[1]));
})();
</script>
<style>
  :root { color-scheme: light dark; --bg: #f2f2f7; --ink: #1d1d1f; --muted: #6e6e73; --accent: #d40000; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161618; --ink: #f5f5f7; --muted: #a1a1a6; --accent: #ff6b61; } }
  html { background: var(--bg); color: var(--ink); font: 400 17px/1.5 "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
  main { max-width: 30em; }
  h1 { font-size: 2rem; font-weight: 500; letter-spacing: -.03em; line-height: 1.1; margin: 0 0 12px; }
  p { color: var(--muted); margin: 0 0 24px; }
  a { color: var(--accent); text-underline-offset: .18em; }
</style>
</head>
<body>
<main>
  <h1>This page isn’t here.</h1>
  <p>The address may be mistyped, or the page has moved.</p>
  <p><a href="/" data-home>Go to Cleo POS</a></p>
</main>
</body>
</html>
