<h2>Confirm your Cleo account</h2>
<p>Follow this link in the browser where you started signing up:</p>
<p><a href="{{ .ConfirmationURL }}">Confirm email address</a></p>
<p>Or enter this eight-digit code on the Cleo verification screen:</p>
<p style="font-size:24px;letter-spacing:4px;font-weight:bold">{{ .Token }}</p>
<p>If you did not request this account, you can ignore this email.</p>
